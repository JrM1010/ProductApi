<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRUD Productos</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
<h1>CRUD — Productos</h1>


<section id="form-section">
<form id="product-form">


    <input type="hidden" id="product-id">


<div class="field"><label>Nombre</label><input id="name" required /></div>
<div class="field"><label>Descripción</label><input id="description" /></div>
<div class="field"><label>Precio</label><input id="price" type="number" step="0.01" required /></div>
<div class="field"><label>Stock</label><input id="stock" type="number" required /></div>
<div class="actions">
<button type="submit">Guardar</button>
<button type="button" id="cancel-btn">Cancelar</button>
</div>
</form>
</section>


<section id="list-section">
<table id="products-table">
<thead>
<tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
</thead>
<tbody></tbody>
</table>
</section>
</main>


<script src="app.js"></script>
</body>
</html>
